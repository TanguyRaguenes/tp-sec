name: Security Scan
on: push

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      # --- Démarrer front + backend (concurrently) ---
      - name: Start full app (front + backend)
        run: yarn dev &

      # --- Attendre que le backend soit prêt sur 3001 ---
      - name: Wait for backend (API)
        run: npx wait-on http://localhost:3001

      # Optionnel mais conseillé : attendre aussi le front
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000

      # --- Lancer le scan ZAP (sur le backend) ---
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3001/"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
