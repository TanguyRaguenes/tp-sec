name: Security Scan
on: push

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node (obligatoire : Node >= 20)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Installer dépendances du projet Vite
      - name: Install dependencies
        run: yarn install

      # 4. Démarrer Vite en background → expose site + API mockée
      - name: Start app (Vite)
        run: yarn dev &

      # 5. Attendre que Vite soit prêt et accessible sur 3001
      - name: Wait for server
        run: npx wait-on http://localhost:3001

      # 6. Lancer ZAP Baseline
      - name: Base scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3001/"

      # 7. Upload du rapport ZAP
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
